{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">
</head>
<body>

    <h1>Login in SnapShare</h1>

    <form method="post">
        {% csrf_token %}

        <div class="username">
            <input type="text" name="username" placeholder="Username" required>
        </div>
        
        <div class="password">
            <input type="Password" name="password" placeholder="Password" required>
        </div>

        <button type='submit'>Login</button>
        <p>Don't have an account, so <a href="{% url 'register' %}">Register</a></p>

        {% if error %}
            <div class="error"><h3>{{error}}</h3></div>
        {% endif %}
    </form>

    
</body>
</html>
